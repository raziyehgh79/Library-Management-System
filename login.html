<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سامانه - سامانه مدیریت کتابخانه</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">📚</div>
                <h1>پرتال دانشجویی کتابخانه</h1>
                <p>لطفاً با مشخصات ثبت‌شده خود در کاریار وارد شوید</p>
            </div>
            
            <div id="alert-container"></div>
            
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">آدرس ایمیل دانشجو</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="مثال: student@student.com" 
                        autocomplete="email" 
                        dir="ltr"
                        style="text-align: left;"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">رمز عبور</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="رمز عبور خود را وارد نمایید" 
                        autocomplete="current-password" 
                        dir="ltr"
                        style="text-align: left;"
                        required
                    >
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
                    <span id="loginText">ورود به سامانه</span>
                    <span id="loginSpinner" class="loading hidden"></span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
                <a href="index.html" style="color: var(--text-muted); text-decoration: none;">&larr; بازگشت به صفحه اصلی</a>
            </div>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
