<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">📚</div>
                <h1>Library Portal</h1>
                <p>Sign in with your student credentials to continue</p>
            </div>
            
            <div id="alert-container"></div>
            
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="e.g. student@student.com" 
                        autocomplete="email" 
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Enter your password" 
                        autocomplete="current-password" 
                        required
                    >
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    <span id="loginText">Sign In</span>
                    <span id="loginSpinner" class="loading hidden"></span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted);">
                <a href="index.html" style="color: var(--text-muted); text-decoration: none;">&larr; Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Login Logic ES Module -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
