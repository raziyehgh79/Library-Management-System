<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرور کتاب‌ها - سامانه مدیریت کتابخانه</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="dashboard.html" class="logo">
                    <span class="logo-icon">📚</span>
                    <span>مدیریت کتابخانه کاریار</span>
                </a>

                <button class="menu-toggle" id="menuToggle" type="button" aria-label="تغییر وضعیت منو" aria-expanded="false">
                    &#9776;
                </button>

                <nav class="nav" id="primaryNav">
                    <a href="dashboard.html">داشبورد</a>
                    <a href="books.html" class="active">مرور کتاب‌ها</a>
                    <a href="my-loans.html">امانت‌های من</a>
                    <a href="#" id="logoutBtn" style="color: var(--danger);">خروج از حساب</a>
                </nav>

                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">د</div>
                    <span class="user-name" id="userName">دانشجو</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">کاتالوگ کتاب‌ها</h1>
                <p class="page-subtitle">کاتالوگ عناوین را مشاهده نموده، بر اساس موضوع فیلتر کنید و کتاب مورد نظر را به صورت زنده به امانت بگیرید.</p>
            </div>
            
            <div id="booksAlert"></div>

            <div class="filter-bar">
                <div class="search-input-wrapper">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="form-input" 
                        placeholder="🔍 جستجوی کتاب بر اساس عنوان، نویسنده یا شابک (ISBN)..." 
                        aria-label="جستجوی کتاب"
                    >
                </div>
                <div class="filter-select-wrapper">
                    <select id="categoryFilter" class="form-select" aria-label="فیلتر موضوعی">
                        <option value="">همه دسته‌بندی‌ها</option>
                    </select>
                </div>
                <div class="filter-select-wrapper">
                    <select id="availabilityFilter" class="form-select" aria-label="فیلتر وضعیت موجودی">
                        <option value="all">همه وضعیت‌ها</option>
                        <option value="available">فقط کتاب‌های موجود</option>
                        <option value="unavailable">فقط کتاب‌های ناموجود</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-3" id="booksGrid">
            </div>
        </div>
    </main>

    <div class="modal" id="bookModal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-content">
            <button class="modal-close-btn" id="modalClose" aria-label="بستن پنجره">&times;</button>
            <div id="modalBody">
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; ۱۴۰۵ سامانه مدیریت کتابخانه &middot; پروژه نهایی جاوااسکریپت</p>
        </div>
    </footer>

    <script type="module" src="js/books.js"></script>
</body>
</html>
