<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Books - Library Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="dashboard.html" class="logo">
                    <span class="logo-icon">📚</span>
                    <span>Library Management</span>
                </a>

                <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false">
                    &#9776;
                </button>

                <nav class="nav" id="primaryNav">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="books.html" class="active">Browse Books</a>
                    <a href="my-loans.html">My Loans</a>
                    <a href="#" id="logoutBtn" style="color: var(--danger);">Logout</a>
                </nav>

                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">S</div>
                    <span class="user-name" id="userName">Student</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">Browse Books</h1>
                <p class="page-subtitle">Explore the collection, filter by genre, and borrow titles directly to your account.</p>
            </div>
            
            <div id="booksAlert"></div>

            <!-- Search and Filter Controls -->
            <div class="filter-bar">
                <div class="search-input-wrapper">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="form-input" 
                        placeholder="🔍 Search books by title, author, or ISBN..." 
                        aria-label="Search books"
                    >
                </div>
                <div class="filter-select-wrapper">
                    <select id="categoryFilter" class="form-select" aria-label="Filter by category">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="filter-select-wrapper">
                    <select id="availabilityFilter" class="form-select" aria-label="Filter by availability">
                        <option value="all">All Availability</option>
                        <option value="available">Available Only</option>
                        <option value="unavailable">Unavailable Only</option>
                    </select>
                </div>
            </div>

            <!-- Dynamic Books Grid Container -->
            <div class="grid grid-3" id="booksGrid">
                <!-- Book cards or skeleton loaders will be injected dynamically by books.js -->
            </div>
        </div>
    </main>

    <!-- Book Details Modal -->
    <div class="modal" id="bookModal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-content">
            <button class="modal-close-btn" id="modalClose" aria-label="Close modal">&times;</button>
            <div id="modalBody">
                <!-- Injected dynamically by books.js -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Library Management System &middot; Final JavaScript Project</p>
        </div>
    </footer>

    <!-- Books Logic ES Module -->
    <script type="module" src="js/books.js"></script>
</body>
</html>
